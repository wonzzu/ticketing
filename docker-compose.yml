

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul

    command: --innodb-buffer-pool-size=128M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: 대기열·좌석 선점·쿠폰 재고는 Redis가 원본이라 LRU로 지워지면 조용히 유실된다.
    # 메모리가 차면 쓰기를 실패시켜 즉시 드러나게 한다. (ADR 12)
    command: --maxmemory 100mb --maxmemory-policy noeviction
    volumes:
      # 이름 붙인 저장 공간을 /data에 연결 (prod와 동일한 이유 — 컨테이너 재생성 시 쿠폰 재고 유실 방지)
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ticketon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ticketon-local-password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-ticketon}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-ticketon-local-password}
      # LocalDateTime 응답과 DB 시간대를 한국 표준시로 통일한다.
      JAVA_OPTS: "-Xmx350m -Duser.timezone=Asia/Seoul"
    depends_on:
      mysql:
        condition: service_healthy   # MySQL 준비된 뒤에 뜸 (커넥션 실패 방지)
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s            # 기동 시간 여유 (첫 배포 스키마 생성 등)

  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"                     # HTTP → HTTPS 리다이렉트
      - "443:443"                   # HTTPS 서비스
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # 호스트의 Let's Encrypt 인증서 (읽기전용)
    depends_on:
      - spring

volumes:
  mysql-data:                        # DB 데이터 영속 (컨테이너 지워도 유지)
  redis-data:                        # 쿠폰 재고 등 Redis가 원본인 데이터 보존
  rabbitmq-data:
