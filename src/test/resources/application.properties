spring.application.name=ticketing

# === 테스트 클래스패스의 베이스 설정 ===
# datasource/JPA는 application-test.properties(@ActiveProfiles("test"))가 전부 덮으므로 여기 두지 않는다.
# 이 파일이 존재하면 src/main 쪽 application.properties는 읽히지 않으므로,
# 프로파일과 무관하게 필요한 값은 여기 남겨야 한다.
spring.jpa.properties.hibernate.default_batch_fetch_size=100


# === Redis — 진짜 도커 Redis 사용 (동시성은 목으로 검증 불가) ===
spring.data.redis.host=localhost
spring.data.redis.port=6379

# === RabbitMQ (로컬 통합 테스트용) ===
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ticketon
spring.rabbitmq.password=ticketon-local-password
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# === JWT (테스트용 더미 — 32바이트 이상) ===
jwt.secret=test-only-secret-key-must-be-at-least-32-bytes-long-1234567890
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=1209600000
