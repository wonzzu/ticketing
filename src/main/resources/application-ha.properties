
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=sentinel1:26379,sentinel2:26379,sentinel3:26379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=1s

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.username=${RABBITMQ_USERNAME:ticketon}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:ticketon-local-password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

decorator.datasource.enabled=false
aws.s3.enabled=false
