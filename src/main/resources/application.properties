spring.application.name=ticketing

# === Profile ===
# local 프로파일에서만 DataSeedRunner 활성화
spring.profiles.active=local

# === JWT ===
jwt.secret=${JWT_SECRET:dev-only-secret-key-must-be-at-least-32-bytes-long-12345}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=1209600000


# === DataSource ===
spring.datasource.url=jdbc:mysql://localhost:3306/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:qwer1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100


# === Redis ===
spring.data.redis.host=localhost
spring.data.redis.port=6379

# === RabbitMQ / Outbox Relay ===
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:ticketon}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:ticketon-local-password}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
outbox.relay.enabled=true
outbox.relay.fixed-delay-ms=1000
outbox.relay.batch-size=20
outbox.relay.confirm-timeout-ms=5000

# === Swagger ===
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# === prometheus ===
management.endpoints.web.exposure.include=prometheus,health
management.metrics.tags.application=ticketing

# === log ===
logging.file.name=logs/ticketing.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB


# === Spring Batch ===
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# === AWS S3 ===
aws.s3.bucket=ticketon-posters
aws.s3.region=ap-northeast-2
aws.s3.enabled=false

# === 파일 업로드 ===
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
