

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: --innodb-buffer-pool-size=128M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: 대기열·좌석 선점·쿠폰 재고는 Redis가 원본이라 LRU로 지워지면 조용히 유실된다.
    # 메모리가 차면 쓰기를 실패시켜 즉시 드러나게 한다. (ADR 12)
    command: --maxmemory 100mb --maxmemory-policy noeviction
    volumes:
      # 이름 붙인 저장 공간을 /data에 연결. 안 적으면 Docker가 이름 없는 임시 공간을 만드는데,
      # 컨테이너를 새로 만들 때마다 새 공간이 붙어 dump.rdb(재시작 대비 저장 파일)와 끊긴다.
      # 쿠폰 재고는 Redis가 원본이라 그때 발급이 전부 막힌다.
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  spring:
    image: ghcr.io/wonzzu/ticketon-spring:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # LocalDateTime 응답과 DB 시간대를 한국 표준시로 통일한다.
      JAVA_OPTS: "-Xmx350m -Duser.timezone=Asia/Seoul"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx:
    image: ghcr.io/wonzzu/ticketon-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - spring

volumes:
  mysql-data:
  redis-data:                        # 쿠폰 재고 등 Redis가 원본인 데이터 보존
