
name: ticketon-ha

# Sentinel 이 IP 로 감시하므로 Redis 계층에는 고정 IP 를 준다.
networks:
  ha-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  redis-master:
    image: redis:7-alpine
    container_name: ha-redis-master
    restart: unless-stopped
    # 대기열·선점 원본이 같은 Redis 에 있어 LRU 로 조용히 지워지면 안 된다.
    command: redis-server --maxmemory 100mb --maxmemory-policy noeviction
    networks:
      ha-net:
        ipv4_address: 172.30.0.10

  redis-replica1: &replica
    image: redis:7-alpine
    container_name: ha-redis-replica1
    restart: unless-stopped
    command: >
      redis-server --replicaof 172.30.0.10 6379
                   --maxmemory 100mb --maxmemory-policy noeviction
    networks:
      ha-net:
        ipv4_address: 172.30.0.11
    depends_on:
      - redis-master

  # 복제본 2대 — 승격 후에도 복제본이 남아야 Redisson 의 락 동기화 검증이 성립한다
  redis-replica2:
    <<: *replica
    container_name: ha-redis-replica2
    networks:
      ha-net:
        ipv4_address: 172.30.0.12

  # Sentinel 은 실행 중 자기 설정 파일에 상태를 덮어쓴다.
  # 원본을 :ro 로 두고 /tmp 에 복사해서 띄워야 3대가 서로 안 깨진다.
  sentinel1: &sentinel
    image: redis:7-alpine
    container_name: ha-sentinel1
    restart: unless-stopped
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./ha/sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      ha-net:
        ipv4_address: 172.30.0.21
    depends_on:
      - redis-master
      - redis-replica1
      - redis-replica2

  sentinel2:
    <<: *sentinel
    container_name: ha-sentinel2
    networks:
      ha-net:
        ipv4_address: 172.30.0.22

  sentinel3:
    <<: *sentinel
    container_name: ha-sentinel3
    networks:
      ha-net:
        ipv4_address: 172.30.0.23

  spring1:
    build: .
    image: ticketon-ha:local
    restart: unless-stopped
    environment: &spring-env
      SPRING_PROFILES_ACTIVE: ha
      # LocalDateTime 응답과 DB 시간대를 한국 표준시로 통일한다.
      JAVA_OPTS: "-Xmx256m -Duser.timezone=Asia/Seoul"
      DB_USERNAME: root
      DB_PASSWORD: qwer1234
      JWT_SECRET: dev-only-secret-key-must-be-at-least-32-bytes-long-12345
    extra_hosts: &host-gateway
      - "host.docker.internal:host-gateway"
    networks: &app-net
      - ha-net
    ports:
      - "8081:8080"
    healthcheck: &healthcheck
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  spring2:
    build: .
    image: ticketon-ha:local
    restart: unless-stopped
    environment: *spring-env
    extra_hosts: *host-gateway
    networks: *app-net
    ports:
      - "8082:8080"
    healthcheck: *healthcheck

  spring3:
    build: .
    image: ticketon-ha:local
    restart: unless-stopped
    environment: *spring-env
    extra_hosts: *host-gateway
    networks: *app-net
    ports:
      - "8083:8080"
    healthcheck: *healthcheck

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks: *app-net
    ports:
      - "8080:80"
    volumes:
      - ./ha/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      spring1:
        condition: service_healthy
      spring2:
        condition: service_healthy
      spring3:
        condition: service_healthy
